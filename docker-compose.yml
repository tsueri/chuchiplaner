services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data:z
      - ./backend/models:/app/models:z
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0

  backup:
    build: ./backup
    restart: unless-stopped
    volumes:
      - ./data:/data:ro,z
      - ./backups:/backups:z
    env_file: .env

volumes:
  ollama_data:
