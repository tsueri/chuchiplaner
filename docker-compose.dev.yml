services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -q uv && uv sync && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - CHUCHI_DATABASE_URL=sqlite+aiosqlite:///./data/chuchiplaner.db
    depends_on:
      - frontend

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backup:
    build: ./backup
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    environment:
      - CHUCHI_DB_PATH=/data/chuchiplaner.db
      - CHUCHI_BACKUP_DIR=/backups
      - CHUCHI_BACKUP_RETENTION=7
      - CHUCHI_BACKUP_INTERVAL=86400
